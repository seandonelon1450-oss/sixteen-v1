# Sixteen™ V1 — CI.
#
# Guard job: fails the build if any forbidden string appears in the repo.
# The ephemeral-registry hostname literal may appear in THIS FILE ONLY
# (the grep that uses it excludes this file, so it cannot self-match).
name: sixteen-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject the ephemeral-registry hostname
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude=ci.yml -F "ttl.sh" .; then
            echo "::error::Forbidden ephemeral-registry hostname found in repo"
            exit 1
          fi
          echo "registry check passed"
      - name: Reject brand avoid-list words in customer-facing code
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E "AI-powered|chatbot|copilot|revolutionary|seamless|cutting-edge|unleash|supercharge|magic|synergy|How can I help you today\?" public server.js data providers; then
            echo "::error::Brand avoid-list word found"
            exit 1
          fi
          echo "brand check passed"
      - name: Reject registered-mark symbol (TM only)
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git "®" public server.js data providers render.yaml README.md; then
            echo "::error::Registered-mark symbol found; use TM only"
            exit 1
          fi
          echo "mark check passed"
      - name: Reject real-person advisor names (archetypes only)
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git -E "Donald Trump|Jefferson Fisher|Jocko Willink|Sophie Cunningham|Dana White|Ben Franklin|Nikola Tesla|Elon Musk|Matthew McConaughey|Denzel Washington|Warren Buffett|Jay Shetty|Mel Robbins|Jordan Peterson|Tony Robbins|Michelangelo" public server.js data providers render.yaml README.md; then
            echo "::error::Real-person advisor name found; archetype titles only"
            exit 1
          fi
          echo "advisor-name check passed"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Boot with a throwaway admin token
        run: |
          SIXTEEN_ADMIN_TOKEN=ci-throwaway-token PORT=3100 node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/healthz && break || sleep 1
          done
      - name: Smoke tests
        run: |
          base=http://localhost:3100
          curl -sf $base/healthz | grep -q '"ok":true'
          curl -sf $base/ | grep -q "Sixteen minds. One decision."
          curl -sf $base/data | grep -q "You own your data"
          curl -sf $base/api/seats | grep -q '"count":16'
          curl -s -X POST $base/api/deliberate -H 'Content-Type: application/json' \
            -d '{"question":"Should I take the promotion or start my business?"}' | grep -q '"mode":"preview"'
          curl -s -X POST $base/api/waitlist -H 'Content-Type: application/json' \
            -d '{"email":"ci-test@example.com","source":"ci"}' | grep -q '"ok":true'
          curl -sf "$base/api/waitlist?token=ci-throwaway-token" | grep -q 'ci-test@example.com'
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/api/waitlist?token=wrong")
          [ "$code" = "403" ] || { echo "expected 403 for wrong token, got $code"; exit 1; }
          curl -s -X POST $base/api/my-data/delete -H 'Content-Type: application/json' \
            -d '{"email":"ci-test@example.com"}' | grep -q '"ok":true'
          if curl -sf "$base/api/waitlist?token=ci-throwaway-token" | grep -q 'ci-test@example.com'; then
            echo "test entry was not deleted"; exit 1
          fi
          echo "smoke tests passed"
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
